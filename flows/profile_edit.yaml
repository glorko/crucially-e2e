# US-001: Edit profile display name from Settings screen.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
# Navigate to Settings
- tapOn:
    id: "nav_settings"
    label: "Open Settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000
# Tap edit name button
- tapOn:
    id: "settings_edit_name"
    label: "Edit display name"
# Dialog should appear
- extendedWaitUntil:
    visible: "Edit Display Name"
    timeout: 3000
# Type new name
- eraseText: 100
- inputText:
    text: "E2E User ${MAESTRO_E2E_SUFFIX}"
    label: "Type new name"
- tapOn:
    text: "Save"
    label: "Save name"
# Assert updated name visible in settings
- extendedWaitUntil:
    visible: "E2E User ${MAESTRO_E2E_SUFFIX}"
    timeout: 5000
    label: "Assert new name visible"
# Go back to feed
- tapOn:
    id: "nav_feed"
