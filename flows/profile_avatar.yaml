# US-001: Edit profile avatar from Settings screen.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
# Navigate to Settings
- tapOn:
    id: "nav_settings"
    label: "Open Settings"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 5000
# Tap on avatar to edit
- tapOn:
    id: "settings_edit_avatar"
    label: "Tap avatar to edit"
# Dismiss the chooser if shown (picker automation is out of scope).
- tapOn:
    text: "Cancel"
    optional: true
- back
- runFlow:
    file: ensure_feed.yaml
