# Helper: Ensure app is on the Feed screen, regardless of starting state.
# Works on both iOS and Android by trying both back mechanisms.
appId: ${MAESTRO_APP_ID}
---
- launchApp:
    # stopApp: true caused flaky cold starts where the feed shell never matched in time; rely on extendedWaitUntil below.
    stopApp: false
# SplashScreen delays AuthWrapper (~2.5s); settle before hunting for nav.
- waitForAnimationToEnd:
    timeout: 8000
# If composer/detail is open on iOS, close it explicitly.
- tapOn:
    text: "Close"
    optional: true
# Dismiss bottom sheets/popups that can hide bottom nav.
- tapOn:
    text: "Cancel"
    optional: true
# Tap Feed tab to ensure we're on feed (handles being on another tab)
- tapOn:
    id: "nav_feed"
    optional: true
# Assert tab scaffold is visible and composer isn't blocking.
- extendedWaitUntil:
    visible:
      id: "nav_feed"
    timeout: 60000
- assertNotVisible:
    id: "post_composer_text_field"
