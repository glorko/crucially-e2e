# Comment flow: Add a comment on the E2E post. Run on the device that will SEND the comment.
# Between-devices: A posts -> B sees post -> A comments -> B sees comment. A runs this after post.yaml.
# The E2E post must be in the feed; the first comment input (newest post) is for that post.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
- assertVisible:
    id: "app_bar_new_post"
# Ensure E2E post is visible so we comment on the right post (first comment field = first post in feed)
- extendedWaitUntil:
    visible: "${MAESTRO_E2E_POST_TEXT}"
    timeout: 30000
    label: "Wait for post: ${MAESTRO_E2E_POST_TEXT}"
# Scroll until comment input is visible (may be below fold for first post)
- scrollUntilVisible:
    element:
      id: "comment_input_text_field"
    direction: DOWN
    timeout: 5000
# Tap comment field by stable id so focus is set before typing
- extendedWaitUntil:
    visible:
      id: "comment_input_text_field"
    timeout: 15000
- tapOn:
    id: "comment_input_text_field"
- inputText:
    text: "${MAESTRO_E2E_COMMENT_TEXT}"
    label: "Type comment: ${MAESTRO_E2E_COMMENT_TEXT}"
- tapOn:
    id: "comment_submit"
- assertVisible:
    text: "${MAESTRO_E2E_COMMENT_TEXT}"
    label: "Assert comment visible: ${MAESTRO_E2E_COMMENT_TEXT}"
