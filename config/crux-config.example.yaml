# Copy to parent crucially repo as config.yaml or config.e2e.yaml
# Used when running E2E: crux -c path/to/config.yaml
backend:
  path: "crucially-backend"
  start_script: "start-backend.sh"
  env:
    DATABASE_URL: "postgres://postgres:postgres@localhost:5440/crucially?sslmode=disable"
    REDIS_URL: "redis://localhost:6382"
    PORT: "50051"

flutter:
  path: "crucially-mobile"
  instances:
    - name: "app1"
      device_id: "90266925-B62F-4741-A89E-EF11BFA0CC57"
      platform: "ios"
    - name: "app2"
      device_id: "Pixel_9a"
      platform: "android"

dependencies:
  postgres:
    host: "localhost"
    port: 5440
    database: "crucially"
    user: "postgres"
    password: "postgres"
  redis:
    host: "localhost"
    port: 6382
