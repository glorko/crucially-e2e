appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
- tapOn:
    id: "nav_connections"
- extendedWaitUntil:
    visible: "Connections"
    timeout: 10000
- tapOn: "Silver"
- extendedWaitUntil:
    visible: "Your slots on this layer"
    timeout: 10000
- tapOn:
    text: "lock"
- extendedWaitUntil:
    visible:
      id: "store_checkout_screen_title"
    timeout: 10000
- assertVisible:
    text: "Subscribe Silver"
- takeScreenshot: "apple_review_slot_checkout"
