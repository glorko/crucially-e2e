# Type text character-by-character (typewriter style).
# Use for fields that use typewriter/animation so pasting doesn't trigger reload.
# Call with: runFlow file: type_text.yaml env: { TYPEWRITER_TEXT: "your text" }
appId: ${MAESTRO_APP_ID}
---
- evalScript: ${output.chars = (TYPEWRITER_TEXT || '').split(''); output.i = 0}
- repeat:
    while:
      true: ${output.i < output.chars.length}
    commands:
      - evalScript: ${output.char = output.chars[output.i]; output.i = output.i + 1}
      - inputText: ${output.char}
