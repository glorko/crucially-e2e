# US-023: Verify connection activity / inactive indicator.
# Connections screen shows last_seen_at status for each connection.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
# Navigate to Connections
- tapOn:
    id: "nav_connections"
    label: "Open Connections"
- extendedWaitUntil:
    visible: "Connections"
    timeout: 5000
    label: "Connections screen loaded"
# The connections screen should display at least one connection
# with activity info (last seen, online, etc.)
# Just verify the screen loads and has content
- assertVisible:
    text: "Connections"
    label: "Connections title visible"
# Go back to feed
- tapOn:
    id: "nav_feed"
