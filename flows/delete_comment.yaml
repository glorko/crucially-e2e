# US-010: Delete own comment. Assumes post is open and has our comment (run comment.yaml first on this device).
# Local soft-delete + COMMENT_DELETED published async; no sync/pull.
# Env: MAESTRO_E2E_COMMENT_DELETE_TEXT — text to find/delete (default in run-e2e.sh: same as MAESTRO_E2E_COMMENT_TEXT; after edit_comment use the edited string).
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
- runFlow:
    file: open_post.yaml
# Our comment (from comment.yaml) must be visible — use DELETE_TEXT so it still matches after edit_comment (default = original comment text).
- extendedWaitUntil:
    visible: "${MAESTRO_E2E_COMMENT_DELETE_TEXT}"
    timeout: 10000
    label: "Wait for own comment"
- scrollUntilVisible:
    element:
      text: "${MAESTRO_E2E_COMMENT_DELETE_TEXT}"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "comment_options"
# Menu opens: tap Delete
- tapOn:
    text: "Delete"
# Confirmation dialog: tap Delete
- tapOn:
    text: "Delete"
# Comment should disappear (list re-read from local DB)
- assertNotVisible:
    text: "${MAESTRO_E2E_COMMENT_DELETE_TEXT}"
