# Maestro E2E config for Crucially
# App IDs - override via env (MAESTRO_APP_ID_IOS, MAESTRO_APP_ID_ANDROID) if needed
env:
  APP_ID_IOS: "app.crucially.ios"
  APP_ID_ANDROID: "app.crucially.android"
  # Staging gRPC (matches crucially-mobile .env-staging); use localhost only for local-backend Maestro runs.
  BACKEND_URL: "dev.grpc.crucially.app:39847"
