# See comment on other device: Run on the RECEIVER device after the sender ran comment.yaml.
# Verifies comment sync to connections. Between-devices flow: A posts -> B sees post -> A comments -> B sees comment.
# App must already be running. Run on the RECEIVER device. ensure_feed brings app to foreground and triggers pull.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
- assertVisible:
    id: "app_bar_new_post"
# Wait for the comment created on the other device to appear (sync + pull may take a few seconds)
- extendedWaitUntil:
    visible: "${MAESTRO_E2E_COMMENT_TEXT}"
    timeout: 10000
    label: "Wait for comment: ${MAESTRO_E2E_COMMENT_TEXT}"
- assertVisible:
    text: "${MAESTRO_E2E_COMMENT_TEXT}"
    label: "Assert comment visible: ${MAESTRO_E2E_COMMENT_TEXT}"
