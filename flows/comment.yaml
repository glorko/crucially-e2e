# Comment flow: Add a comment on the E2E post. Run on the SENDER device (e.g. Device B) after see_post_on_other_device.yaml
# so the E2E post is in the feed; the first comment input is then for that post.
# Flow order: Device A post.yaml -> Device B see_post_on_other_device.yaml -> Device B comment.yaml -> Device A see_comment_on_other_device.yaml
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
- assertVisible: "New Post"
# Ensure E2E post is visible so we comment on the right post (first comment field = first post in feed)
- extendedWaitUntil:
    visible: "${MAESTRO_E2E_POST_TEXT}"
    timeout: 30000
# Tap comment field by stable id so focus is set before typing
- extendedWaitUntil:
    visible:
      id: "comment_input_text_field"
    timeout: 15000
- tapOn:
    id: "comment_input_text_field"
- inputText: "E2E comment from Maestro"
- tapOn:
    id: "comment_submit"
- assertVisible: "E2E comment from Maestro"
