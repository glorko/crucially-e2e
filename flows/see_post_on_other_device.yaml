# See post on other device: After device A ran post.yaml, run this on device B.
# Ensures feed is shown, pulls inbox on resume/tab, then waits for the post to appear.
# App must already be running. Run on the RECEIVER device (B). Sender (A) runs post.yaml first.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
- assertVisible:
    id: "app_bar_new_post"
# App pulls inbox on resume. Newest at top — scroll UP to find, or extendedWait if already visible.
- extendedWaitUntil:
    visible: "${MAESTRO_E2E_POST_TEXT}"
    timeout: 10000
    label: "Wait for post: ${MAESTRO_E2E_POST_TEXT}"
- assertVisible:
    text: "${MAESTRO_E2E_POST_TEXT}"
    label: "Assert post visible: ${MAESTRO_E2E_POST_TEXT}"
