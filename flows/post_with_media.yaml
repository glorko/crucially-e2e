# US-024: Post with media attachment.
# NOTE: Actual image/video picker requires system dialog interaction which
# Maestro cannot fully automate. This flow verifies the media attachment
# UI is accessible and the composer handles the flow correctly.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
# Open post composer
- tapOn:
    id: "app_bar_new_post"
    label: "Open composer"
- extendedWaitUntil:
    visible:
      id: "post_composer_text_field"
    timeout: 5000
# Verify add media button is accessible
- assertVisible:
    id: "post_composer_add_media"
    label: "Add media button visible"
# Tap add media
- tapOn:
    id: "post_composer_add_media"
    label: "Tap Add media"
# Media options sheet should appear
- extendedWaitUntil:
    visible: "Choose from Gallery"
    timeout: 3000
    label: "Media options sheet visible"
- assertVisible:
    text: "Shoot"
    label: "Camera option visible"
# Dismiss the bottom sheet (tap outside or press back)
- back
# Create a text-only post instead (media picker requires system UI)
- tapOn:
    id: "post_composer_text_field"
- inputText:
    text: "${MAESTRO_E2E_POST_TEXT}"
    label: "Type post text"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "post_composer_submit_button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "post_composer_submit_button"
    label: "Submit post"
- extendedWaitUntil:
    visible:
      id: "app_bar_new_post"
    timeout: 5000
    label: "Back on feed"
