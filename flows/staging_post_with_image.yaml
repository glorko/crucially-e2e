# Staging: post with image attachment (presigned PUT or gRPC unary upload).
# scripts/run_staging_post_image.sh seeds files/e2e_1x1.png and sets E2E_INJECT_IMAGE so the app
# skips the system Photo Picker (reliable in Maestro).
# Manual picker path: use flows/pick_first_gallery_image.yaml after gallery tap if not using inject.
appId: ${MAESTRO_APP_ID}
---
- setPermissions:
    permissions:
      all: allow
- addMedia:
    - "../assets/e2e_1x1.png"
# addMedia can leave DocumentsUI PickActivity on top; back so launchApp reaches our app.
- back
- runFlow:
    file: ensure_feed.yaml
- tapOn:
    id: "app_bar_new_post"
- extendedWaitUntil:
    visible:
      id: "post_composer_text_field"
    timeout: 10000
- tapOn:
    id: "post_composer_add_media"
- extendedWaitUntil:
    visible:
      id: "post_composer_sheet_gallery"
    timeout: 15000
    label: "Media options sheet"
- tapOn:
    id: "post_composer_sheet_gallery"
    label: "Pick from gallery"
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "post_composer_text_field"
    timeout: 30000
- tapOn:
    id: "post_composer_text_field"
- inputText:
    text: "Maestro staging image post"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "post_composer_submit_button"
    direction: DOWN
    timeout: 8000
- tapOn:
    id: "post_composer_submit_button"
- extendedWaitUntil:
    visible:
      id: "app_bar_new_post"
    timeout: 60000
    label: "Composer closed after post"
