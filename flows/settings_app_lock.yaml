# US-019: App lock controls are intentionally hidden for MVP.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: ensure_feed.yaml
- tapOn:
    id: "nav_settings"
    label: "Open Settings tab"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- tapOn:
    id: "nav_feed"
    label: "Back to Feed"
